<title>리더뉴 농가 직거래 INDEX</title>
<style>
/* 리더뉴 지속가능 INDEX 체계: 잉크 상단바·히어로, 민트 강조, 필터 스트립 → 전국 지도 → 목록표 → 상세표 */
:root{--mint:#00A98F;--mint-d:#00806D;--mint-l:#5CCFBB;--mint-05:#F0FBF8;--mint-10:#DCF4EE;--ink:#0E1A17;--paper:#fff;--fg:#0E1A17;--g05:#f6f8f7;--g10:#ebeeed;--g20:#d4d9d7;--g40:#949b98;--g60:#5f6663;--g80:#323836;--line:#e1e5e3;--land:#f2f5f4;--landh:#e3efeb;--sea:#fbfcfc;--onink:#fff;--hanaro:#8a918e;color-scheme:light}

:root[data-theme="dark"]{--mint-05:#10302a;--mint-10:#14403a;--paper:#0f1513;--fg:#e8eeec;--g05:#161d1b;--g10:#1f2725;--g20:#34403c;--g40:#7d8784;--g60:#a3ada9;--g80:#cfd7d4;--line:#27312e;--land:#1a2321;--landh:#21352f;--sea:#0f1513;--hanaro:#6f7874;--mint-d:#5CCFBB;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Freesentation','Pretendard','NanumGothic','나눔고딕',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--paper);color:var(--fg);line-height:1.45;font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px}
button{font-family:inherit;color:inherit}
a{color:var(--mint-d)}
h1,h2,h3{text-wrap:balance}
.top{background:var(--ink);color:var(--onink);position:sticky;top:env(safe-area-inset-top,0px);z-index:60}
.topin{display:flex;align-items:center;gap:14px;min-height:60px}
.logo{font-size:17px;font-weight:900;white-space:nowrap;cursor:pointer;background:none;border:0;color:var(--onink)}.logo .idx{font-weight:400;opacity:.7}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}.nav::-webkit-scrollbar{display:none}
.nav button{flex-shrink:0;white-space:nowrap;padding:8px 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgba(255,255,255,.75);font-weight:700;font-size:13.5px;cursor:pointer}
.nav button:hover{color:#fff;border-color:rgba(255,255,255,.3)}.nav button.on{background:var(--mint);color:#fff}
@media(max-width:860px){.topin{flex-wrap:wrap;gap:6px;padding-block:9px}.nav{margin-left:0;flex:1 1 100%}.logo{font-size:15px}}
.hero{background:var(--ink);color:var(--onink);padding-block:28px 24px;border-top:1px solid rgba(255,255,255,.08)}
.hero .kick{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--mint-l);margin-bottom:8px}
.hero h1{font-size:27px;font-weight:900;letter-spacing:-.02em;line-height:1.3}.hero h1 em{font-style:normal;color:var(--mint-l)}
.hero p{font-size:15px;color:rgba(255,255,255,.74);margin-top:10px;line-height:1.65;max-width:46em}
.hstats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:rgba(255,255,255,.62)}.hstats b{color:#fff;font-weight:900;font-variant-numeric:tabular-nums}

.dstrip{border-bottom:1px solid var(--line);padding-block:12px;background:var(--paper)}
.axrow{display:flex;align-items:center;gap:12px;min-width:0}.axrow+.axrow{margin-top:8px;padding-top:8px;border-top:1px dashed var(--g20)}

@media(max-width:700px){.axlab{width:48px;font-size:12px}}
.dstripin{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0;min-width:0;flex:1}.dstripin::-webkit-scrollbar{display:none}
.dpill{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--g20);border-radius:8px;cursor:pointer;background:var(--paper);white-space:nowrap;line-height:1.2;font-size:13.5px;font-weight:700;color:var(--g80)}
.dpill:hover{border-color:var(--mint)}.dpill.on{background:var(--mint);border-color:var(--mint);color:#fff}

.dpill.hn{border-style:dashed}.dpill.hn.on{background:var(--g80);border-color:var(--g80);border-style:solid;color:var(--paper)}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;flex-shrink:0}
.board{padding-block:22px 56px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:960px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;touch-action:auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sea);height:min(78vh,760px);min-height:420px;touch-action:none}

.mapbox svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.mapbox svg.drag{cursor:grabbing}
.prov{fill:var(--land);stroke:var(--g40);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
.prov:hover{fill:var(--landh)}.prov.sel{fill:var(--mint-05);stroke:var(--mint-d);stroke-width:1.4}
.muni{fill:none;stroke:var(--g20);stroke-width:.35;vector-effect:non-scaling-stroke;pointer-events:none}
.pin{cursor:pointer;vector-effect:non-scaling-stroke}
.pin.t0{fill:var(--mint-d);stroke:var(--paper);stroke-width:1}
.pin.t1{fill:var(--paper);stroke:var(--mint-d);stroke-width:2.2}
.pin.t2{fill:var(--mint-l);stroke:var(--ink);stroke-width:.8}
.pin.t3{fill:var(--ink);stroke:var(--mint-l);stroke-width:1.4}
.pin.t4{fill:var(--g80);stroke:var(--paper);stroke-width:1}

.zoomer{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}

.zoomer button.wide{font-size:12px}
.zoomer button:hover{border-color:var(--mint)}
.legend{position:absolute;left:10px;top:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:grid;gap:4px;z-index:3;max-width:60%}
@media(max-width:700px){.legend{display:none}.hint{font-size:10.5px}}
.legend div{display:flex;align-items:center;gap:7px;white-space:nowrap}
.lg{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-sizing:border-box}
.lg.t0{background:var(--mint-d)}.lg.t1{background:var(--paper);border:2.4px solid var(--mint-d)}.lg.t2{background:var(--mint-l);border:1px solid var(--ink)}.lg.t3{background:var(--ink);border:2px solid var(--mint-l)}.lg.t4{background:var(--g80)}.lg.t5{background:var(--hanaro)}
.hint{position:absolute;left:10px;bottom:10px;font-size:11.5px;color:var(--g60);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:4px 8px;z-index:2}
.side{border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;background:var(--paper)}
@media(min-width:961px){.side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}}
.side .k{font-size:11.5px;font-weight:900;letter-spacing:.08em;color:var(--mint-d)}
.side h3{font-size:19px;font-weight:900;margin:4px 0 8px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 10px;font-size:13.5px;line-height:1.55}
.kv dt{color:var(--g60);font-weight:700;font-size:12.5px}.kv dd{overflow-wrap:anywhere}

.sumrow b{font-variant-numeric:tabular-nums;font-weight:900}
.more.nv{display:block;text-align:center;text-decoration:none;margin-top:12px;background:var(--ink);color:var(--onink);border-color:var(--ink)}
#nmap{position:absolute!important;inset:0;width:100%!important;height:100%!important}
.nmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;color:var(--g60);background:var(--g05);z-index:4;line-height:1.7}
.npin{display:block;width:12px;height:12px;border-radius:50%;box-sizing:border-box;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.9)}
.npin.t0{background:#00806D}.npin.t1{background:#fff;border:2.5px solid #00806D}.npin.t2{background:#5CCFBB;border:1px solid #0E1A17}.npin.t3{background:#0E1A17;border:2px solid #5CCFBB}.npin.t4{background:#323836}
.npin.act{width:20px;height:20px;box-shadow:0 0 0 3px #fff,0 0 0 5px #0E1A17}
.prec{font-size:11.5px;color:var(--g60);margin-top:10px;line-height:1.5;border-top:1px dashed var(--g20);padding-top:8px}
.listhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:28px 0 10px}
.listhead h3{font-size:17px;font-weight:800}.lmeta{font-size:13px;color:var(--g60)}.lmeta b{color:var(--fg)}
.search{width:min(100%,320px);padding:9px 12px;border:1px solid var(--g20);border-radius:8px;font-size:14.5px;background:var(--paper);color:var(--fg)}
.search:focus{outline:none;border-color:var(--mint)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:11.5px;font-weight:800;color:var(--g60);letter-spacing:.06em;padding:0 12px 10px;border-bottom:2px solid var(--mint)}
td{padding:13px 12px;border-bottom:1px solid var(--g10);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--mint-05)}
td.nm{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
td.meta{font-size:13px;color:var(--g60);line-height:1.5;overflow-wrap:anywhere}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;white-space:nowrap}
.st.o{background:var(--mint);color:#fff}.st.b{background:var(--mint-10);color:var(--mint-d)}.st.u{border:1px dashed var(--g20);color:var(--g60)}
.tg{display:inline-block;font-size:11.5px;font-weight:800;border:1px solid var(--g20);border-radius:5px;padding:1px 6px;color:var(--g80);white-space:nowrap}
@media(max-width:860px){.lt thead{display:none}.lt tr{display:block;padding:12px 2px;border-bottom:1px solid var(--g10)}.lt td{display:block;border:0;padding:0}.lt td.meta{margin-top:3px}}
.more{display:block;width:100%;padding:12px;margin-top:10px;background:var(--paper);border:1px solid var(--mint);color:var(--mint-d);border-radius:9px;font-weight:800;font-size:14px;cursor:pointer}.more:hover{background:var(--mint);color:#fff}
.lead{font-size:13.5px;line-height:1.7;color:var(--g80);background:var(--mint-05);border-left:3px solid var(--mint);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 12px;max-width:62em}
.vhead{margin-bottom:16px}.vhead .k{font-size:12px;font-weight:900;color:var(--mint-d);letter-spacing:.08em}.vhead h2{font-size:24px;font-weight:900;letter-spacing:-.02em;margin-top:2px}.vhead p{font-size:14.5px;color:var(--g60);margin-top:6px;max-width:52em;line-height:1.65}
.backbtn{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:16px}.backbtn:hover{background:var(--mint-d)}
h2.cn{font-size:25px;font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font-size:13px;font-weight:700;border:1px solid var(--g20);border-radius:6px;padding:5px 11px;color:var(--g80)}.chip small{font-weight:600;color:var(--g40);margin-right:5px}
.sec{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--g60);margin:24px 0 10px}
.task{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:130px minmax(0,1fr);border-bottom:1px solid var(--g10)}.trow:last-child{border-bottom:0}
.trow .tk{background:var(--g05);padding:12px 14px;font-size:12px;font-weight:900;color:var(--g60)}
.trow .tv{padding:12px 16px;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-line}
.trow .tv.na{color:var(--g40)}
@media(max-width:620px){.trow{grid-template-columns:1fr}.trow .tk{padding:10px 14px 2px;background:transparent}.trow .tv{padding:2px 14px 12px;font-size:14px}}
.srcs{list-style:none;display:grid;gap:6px;font-size:13px}.srcs li{overflow-wrap:anywhere;padding-left:12px;position:relative}.srcs li:before{content:'';position:absolute;left:0;top:9px;width:5px;height:2px;background:var(--mint)}
.cta{margin-top:26px;border:1px solid var(--mint);background:var(--mint-05);border-radius:10px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

.copy{padding:9px 14px;border-radius:8px;border:1px solid var(--mint);background:var(--paper);color:var(--mint-d);font-weight:800;cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}@media(max-width:860px){.grid3{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-top:3px solid var(--mint);border-radius:10px;padding:14px;min-width:0}
.card .t{font-size:14px;font-weight:900}.card .d{font-size:13px;color:var(--g60);margin-top:5px;line-height:1.6}
.card .n{font-size:24px;font-weight:900;color:var(--mint-d);font-variant-numeric:tabular-nums;margin-top:6px}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}@media(max-width:760px){.notes{grid-template-columns:1fr}}
.note{padding:12px 0;border-top:1px solid var(--g10)}.note h4{font-size:13.5px;font-weight:800}.note p{font-size:13px;color:var(--g60);margin-top:4px;line-height:1.65}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v3 레이아웃: 지도 + 오른쪽 목록·검색 */
:root{--mh:min(72vh,680px)}
html.emb{--mh:min(calc(var(--pvh,800px)*.72),680px)}

@media(max-width:960px){.mapgrid2{grid-template-columns:minmax(0,1fr)}}
.mapbox{height:var(--mh);min-height:380px}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--paper);display:flex;flex-direction:column;height:var(--mh);min-height:380px;overflow:hidden;min-width:0}

.panel .search{width:100%}

</style>

let mapBuilt=false,lastView='';
function route(h){const [v,arg]=(h||'#map').replace(/^#/,'').split('/');const a=arg===undefined||arg===''?null:+arg;
  if(v==='online'||v==='community'||v==='support'){if(a!=null&&!isNaN(a)){(v==='online'?onlineDetail:v==='community'?commDetail:supDetail)(a)}else{show(v);(v==='online'?online:v==='community'?community:support)()}scrollTo(0,0);lastView=v;return}
  if(v==='partner'||v==='about'){show(v);(v==='partner'?partner:about)();scrollTo(0,0);lastView=v;return}
  show('map');if(lastView!=='map'){scrollTo(0,0);if(!mapBuilt){mapBuilt=true}}
  if(a!=null&&!isNaN(a)&&S[a])select(a);else unselect();lastView='map'}
function go(h){if(h===location.hash){route(h);return}try{history.pushState({rtn:1},'',h);navDepth++}catch(e){location.hash=h;return}route(h)}
function back(fallback){if(navDepth>0){history.back()}else{try{history.replaceState({rtn:1},'',fallback)}catch(e){}route(fallback)}}
addEventListener('popstate',()=>{navDepth=Math.max(0,navDepth-1);route(location.hash)});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go('#'+b.dataset.go));
addEventListener('resize',()=>{if(map&&!$('#v-map').hidden)map.setSize(new naver.maps.Size(box.clientWidth,box.clientHeight))});
render();route(location.hash||'#map');

addEventListener('message',function(e){var m=e.data||{};if(m.type==='rtn-view'&&m.h>200&&Math.abs(m.h-pvh)>80){pvh=m.h;document.documentElement.style.setProperty('--pvh',m.h+'px');h()}});
